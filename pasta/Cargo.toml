[package]
name = "pasta"
version = "0.2.1"
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Readers, writers, and algorithms for SAM, BAM, CRAM, VCF, BCF, BGZF, CSI, tabix, and FASTA"
publish = false

[features]
libdeflate = ["dep:libdeflater", "dep:libdeflate-sys"]

[dependencies]
bit-vec = "0.10.1"
bitflags.workspace = true
bstr.workspace = true
bytes = "1.10.0"
bzip2 = "0.6.0"
crossbeam-channel = "0.5.6"
flate2.workspace = true
indexmap.workspace = true
lexical-core.workspace = true
libdeflate-sys = { version = "1.19.0", optional = true }
libdeflater = { version = "1.19.0", optional = true }
lzma-rust2 = { version = "0.22.0", default-features = false, features = ["encoder", "std", "xz"] }
md-5.workspace = true
memchr.workspace = true
rustc-hash = "2.1.3"
zlib-rs = { version = "0.6.3", features = ["avx512"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.150"

[lints]
workspace = true
