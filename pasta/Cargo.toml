[package]
name = "pasta"
version = "0.9.1"
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Readers, writers, and algorithms for SAM, BAM, CRAM, VCF, BCF, BGZF, CSI, tabix, and FASTA"
publish = false

[dependencies]
bit-vec = "0.10.1"
bitflags.workspace = true
bstr.workspace = true
bytes = "1.10.0"
bzip2 = "0.6.0"
crossbeam-channel = "0.5.6"
flate2.workspace = true
indexmap.workspace = true
lexical-core.workspace = true
lzma-rust2 = { version = "0.22.0", default-features = false, features = ["encoder", "std", "xz"] }
memchr.workspace = true
rustc-hash = "2.1.3"
# DEFLATE, gzip and CRC32: BGZF blocks, CRAM's gzip blocks.
zflate = "1.0.0"
# Only to enable the AVX-512 code of flate2's backend, which decodes plain (not BGZF) gzip.
zlib-rs = { version = "0.6.3", features = ["avx512"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.150"

[lints]
workspace = true
