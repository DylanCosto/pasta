[package]
name = "ntools"
version = "0.2.0"
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "A samtools-compatible command-line toolkit built on pasta"
publish = false

[[bin]]
name = "ntools"
path = "src/main.rs"

[features]
default = ["libdeflate"]
libdeflate = ["pasta/libdeflate"]

[dependencies]
anyhow = "1.0.86"
bstr.workspace = true
clap = { version = "4.5.0", features = ["derive", "wrap_help"] }
crc32fast = "1.4.0"
crossbeam-channel = "0.5.6"
flate2.workspace = true
indexmap.workspace = true
lexical-core.workspace = true
libc = "0.2.150"
md-5.workspace = true
memchr.workspace = true
pasta = { path = "../pasta" }
regex = { version = "1.10.0", default-features = false, features = ["std", "perf"] }
rustc-hash = "2.1.3"
tempfile = "3.10.0"

[dev-dependencies]
assert_cmd = "2.0.14"

[lints]
workspace = true
